baseURL: "https://philipshurpik.github.io/"
title: "Philip's AI Journey"
theme: "PaperMod"
locale: "en-us"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 8

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  description: "Notes on LLM infrastructure, GPU inference, and production ML systems"
  defaultTheme: auto # light / dark / auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowToc: false # can be enabled per-post with "showtoc: true" in front matter
  hideSummary: false

  homeInfoParams:
    Title: "AI engineering in production"
    Content: |
      I am Philip Shurpik, Head of Engineering at **LetsData**. I build AI infrastructure that holds
      up in production: 15+ years in software engineering, 8+ of them in AI/ML.

      My team runs an InfoOps detection platform that analyzes millions of social media posts and
      tens of thousands of videos every day. I am deep in right now: Self-hosted LLMs, Multimodal pipelines, Observability, Agentic workflows

      Before this I was employee #3 at **Reface**, where I built the video face-swap ML pipeline and scaled it to 25k+ swaps per minute on cloud GPUs.  
      [More about me →](/about/)

  socialIcons:
    - name: github
      url: "https://github.com/philipshurpik"
    - name: linkedin
      url: "https://www.linkedin.com/in/philipshurpik/"
    - name: rss
      url: "index.xml"

menu:
  main:
    - identifier: about
      name: About
      url: /about/
      weight: 5
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
